name: Copiar e gerar APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  copiar-e-compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copiar o repositório original para este
        run: |
          git clone --depth 1 https://github.com/duplexspy/effectscraft-unofficial-mobile-port /tmp/origem
          rm -rf /tmp/origem/.git /tmp/origem/.github
          cp -a /tmp/origem/. .
          sed -i '/aapt2FromMavenOverride/d' packaging/android/gradle.properties
          sed -i '/localMvnRepository/d' packaging/android/build.gradle
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Copia do EffectCraft mobile" || echo "nada novo"
          git push
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - name: Compilar o APK
        working-directory: packaging/android
        run: gradle assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: effectcraft-apk
          path: packaging/android/app/build/outputs/apk/release/*.apk